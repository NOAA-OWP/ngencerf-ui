# .github/workflows/podman-smoke.yml
# ADDITIVE WORKFLOW: Proves Podman build and smoke verification for ngencerf-ui.
# Leaves existing .github/workflows/cicd.yml and Docker release paths untouched.

name: Podman Build & Smoke (Additive)

on:
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push test tags (:podman-test) to GHCR"
        required: true
        type: boolean
        default: false
  pull_request:
    branches:
      - development
    paths:
      - '.github/workflows/podman-smoke.yml'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'package*.json'
      - 'nuxt.config.ts'

permissions:
  contents: read
  packages: write

jobs:
  podman-build-smoke:
    name: Podman Build & Smoke (UI)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Preinstalled Podman Environment
        run: |
          podman version
          podman info --format 'OS: {{.Host.Distribution.Distribution}} {{.Host.Distribution.Version}} | Storage: {{.Store.GraphDriverName}}'

      - name: Build Image with Podman (Docker Format)
        id: build
        run: |
          set -euo pipefail
          ulimit -n 65535 || true
          IMAGE_TAG="localhost/ngencerf-ui:podman-test"

          echo "Building ${IMAGE_TAG} using existing Dockerfile with --format docker..."
          podman build \
            --ulimit nofile=65535:65535 \
            --build-arg NGENCERF_BASE_URL="" \
            --format docker \
            -f Dockerfile \
            -t "${IMAGE_TAG}" \
            .

          echo "IMAGE_LOCAL=${IMAGE_TAG}" >> "${GITHUB_ENV}"

      - name: Smoke Probe 1 - Entrypoint & npm CLI Check
        run: |
          set -euo pipefail
          echo "Verifying entrypoint and npm CLI..."
          podman run --rm "${IMAGE_LOCAL}" --version
          podman run --rm --entrypoint node "${IMAGE_LOCAL}" --version
          echo "Probe 1 Passed: Entrypoint npm CLI and Node runtime executable."

      - name: Smoke Probe 2 - Compiled Nitro Server Bundle Verification
        run: |
          set -euo pipefail
          echo "Verifying compiled Nitro server bundle exists and is non-empty..."
          # Display bundle artifact details in CI log
          podman run --rm --entrypoint ls "${IMAGE_LOCAL}" -lh .output/server/index.mjs
          # Assert bundle is non-empty
          podman run --rm --entrypoint test "${IMAGE_LOCAL}" -s .output/server/index.mjs
          echo "Probe 2 Passed: Nitro server build artifact (.output/server/index.mjs) verified."

      - name: Inspect Built OCI Image
        run: |
          podman image inspect "${IMAGE_LOCAL}" \
            --format 'Image ID: {{.Id}} | Digest: {{.Digest}} | Entrypoint: {{.Config.Entrypoint}} | Cmd: {{.Config.Cmd}}'

      - name: Optional GHCR Push (:podman-test only)
        if: ${{ inputs.push_images }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          DEST_BASE="ghcr.io/${REPO_LOWER}"
          TAG_TEST="${DEST_BASE}:podman-test"
          TAG_SHA="${DEST_BASE}:${{ github.sha }}-podman-test"

          echo "Publishing test verification tags..."
          podman tag "${IMAGE_LOCAL}" "${TAG_TEST}"
          podman tag "${IMAGE_LOCAL}" "${TAG_SHA}"

          podman push "${TAG_TEST}"
          podman push "${TAG_SHA}"

          echo "Pushed ${TAG_TEST} and ${TAG_SHA}"
          echo "NOTICE: Production aliases (:latest, branch tags) remain untouched."
