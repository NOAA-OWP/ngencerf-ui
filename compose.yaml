name: ngencerf-ui

# Every value below is read from the environment. Defaults live in ./.env
# (loaded automatically by Compose); variables set in the shell override them.
services:
  ngencerf-app:
    # Always built locally (pull_policy: build), never pulled. Set
    # NGENCERF_UI_IMAGE_NAME to tag the build for a registry.
    image: ${NGENCERF_UI_IMAGE_NAME:-ngencerf-ui:local}
    pull_policy: build
    build:
      context: .
      args:
        # Build-time and runtime working directory inside the image (see Dockerfile).
        WORKDIR_PATH: ${WORKDIR_PATH:-/var/www/ngencerf/nuxt-app}
        # Port baked into the image's ENV PORT and EXPOSE (see Dockerfile).
        NGENCERF_UI_CONTAINER_PORT: ${NGENCERF_UI_CONTAINER_PORT:-3000}
    ports:
      - "${NGENCERF_UI_HOST_PORT:-3000}:${NGENCERF_UI_CONTAINER_PORT:-3000}"
    environment:
      NUXT_HOST: "0.0.0.0"
      # PORT is what the production server (Nitro) reads; NUXT_PORT keeps
      # `nuxt dev`/`nuxt preview` consistent with it.
      PORT: ${NGENCERF_UI_CONTAINER_PORT:-3000}
      NUXT_PORT: ${NGENCERF_UI_CONTAINER_PORT:-3000}
